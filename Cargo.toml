[package]
name = "ecran-live"
version = "0.2.0"
edition = "2021"

[dependencies]
screencapturekit = { version = "8", features = ["macos_14_0"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
core-graphics = { version = "0.24", features = ["highsierra"] }
ureq = { version = "2", features = ["json"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
