[package]
name = "ecran-live"
version = "0.2.0"
edition = "2021"

[dependencies]
screencapturekit = { version = "8", features = ["macos_14_0"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
core-graphics = { version = "0.24", features = ["highsierra", "elcapitan"] }
accessibility = "0.2"
core-foundation = "0.10"
accessibility-sys = "0.2"
objc = "0.2"
tiny-skia = "0.11"
objc2-foundation = "0.3"
libc = "0.2"
foreign-types = "0.3"
ureq = { version = "2", features = ["json"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
strip = true
